<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        html, body{
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        .main{
            height: 100%;
            width: 100%;
            background-color: #023e8a;
            padding: 50px;
            position: relative;
        }

        .grid{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 28px;
        }

        .new-note{
            width: 100%;
            height: 200px;
            border-radius: 10px;
            border: 5px dotted white;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
        }

        .note{
            width: 100%;
            height: 200px;
            border-radius: 10px;
            background-color: #0096c7;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: start;
            gap: 10px;
            color: white;
        }

        .note-operations{
            display: flex;
            justify-content: start;
            align-items: center;
            gap: 10px;
        }

        .note-operations button{
            padding: 10px 12px;
            border: none;
            outline: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #48cae4;
        }

        .note:hover{
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 1s;
            transform: translateY(-5px);
            box-shadow: 4px 4px 10px 2px rgba(0, 0, 0, 0.3);
        }

        .note h3{
            font-size: 30px;
        }

        .note p{
            font-size: 15px;
        }

        .form{
            position: absolute;
            inset: 0px;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.80);
            display: none;
        }

        form{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        form input, textarea{
            padding: 10px 15px;
            outline: none;
            border: none;
            font-size: 20px;
            border-radius: 20px;
        }

    </style>
</head>
<body>
    <div class="main">

        <div class="form">
            <form>
            <input type="text" placeholder="Task Title" required>
            <textarea id="" placeholder="Task Description" required></textarea>
            <input type="submit" value="Done">
        </form>
        </div>

        <div class="grid">
            <div class="new-note">
                <span style="font-size: 50px;">+</span>
            </div>

            <!-- <div class="note">
                <h3>Code 2 hours</h3>
                <p>Open VS code, code JavaScript for maore than 2 hours and after completing that revise all those concepts and later a week again revise those all the things once again.</p>
                <div class="note-operations">
                    <button>Done</button>
                    <button>Delete</button>
                </div>
            </div> -->
        </div>
    </div>

    <script src="notes.js"></script>
</body>
</html>
